[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eu-ai-auditor"
version = "0.4.0"
description = "Audit reproductible, intersectionnel et procédural des systèmes de décision assistés par IA"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "EU AI Auditor contributors" }]
keywords = ["ai-act", "fairness", "audit", "cdd", "intersectionality", "human-oversight", "ro-crate"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Legal Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "reportlab>=4.0,<5",
  "scikit-learn>=1.3,<2",
  "scipy>=1.11,<2",
  "streamlit>=1.50,<2",
]

[project.urls]
Homepage = "https://github.com/ZeroGravityYz/eu-ai-auditor"
Repository = "https://github.com/ZeroGravityYz/eu-ai-auditor"
Issues = "https://github.com/ZeroGravityYz/eu-ai-auditor/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pypdf>=5,<7",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
research = [
  "openpyxl>=3.1,<4",
]

[project.scripts]
eu-ai-auditor = "eu_ai_auditor.cli:main"
eu-ai-auditor-oversight = "eu_ai_auditor.oversight_cli:main"
eu-ai-auditor-research = "eu_ai_auditor.research_cli:main"
eu-ai-auditor-verify = "eu_ai_auditor.verify_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eu_ai_auditor"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/eu_ai_auditor",
  "/app.py",
  "/pages/2_OversightParity.py",
  "/pages/3_Research_Workbench.py",
  "/README.md",
  "/LICENSE",
  "/CITATION.cff",
  "/CHANGELOG.md",
  "/docs",
  "/data/cases",
  "/data/oversight_demo.csv",
  "/data/recrutement_demo.csv",
]
