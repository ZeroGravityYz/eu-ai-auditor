[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eu-ai-auditor"
version = "0.1.0"
description = "Audit CDD, détection de proxys et dossier de preuves pour l'AI Act européen"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "EU AI Auditor contributors" }]
keywords = ["ai-act", "fairness", "audit", "cdd", "bias", "compliance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Legal Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "reportlab>=4.0,<5",
  "scikit-learn>=1.3,<2",
  "scipy>=1.11,<2",
  "streamlit>=1.50,<2",
]

[project.optional-dependencies]
dev = [
  "pypdf>=5,<7",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
eu-ai-auditor = "eu_ai_auditor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eu_ai_auditor"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
